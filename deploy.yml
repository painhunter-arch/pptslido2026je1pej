# GitHub に置くだけで、接続設定と PowerPoint アドインの設定ファイルを作り、GitHub Pages に公開する
name: 公開（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: 接続設定（config.js）とアドインの設定ファイル（manifest.xml）を作る
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ADDIN_ID: ${{ vars.ADDIN_ID }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 tools/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
